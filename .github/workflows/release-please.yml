name: Release

# Conventional Commits merged to main drive release-please: it keeps a release
# PR open with the changelog and version bump. Merging that PR creates the tag
# and the GitHub release, then the `assets` job builds and uploads the binaries.
#
# Tags created with the default GITHUB_TOKEN do not trigger other workflows, so
# the asset build lives in this same workflow instead of a tag-triggered one.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.0

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: zig build

      - name: Binary version must match the tag
        run: |
          set -eu
          version=$(./zig-out/bin/kevin --version | cut -d' ' -f2)
          [ "$version" = "${TAG#v}" ] || { echo "tag $TAG does not match kevin $version" >&2; exit 1; }

      - name: Full check before publishing
        run: ./zig-out/bin/kevin check

      - name: Cross-compile
        run: ./zig-out/bin/kevin release

      - name: Package
        run: |
          set -eu
          mkdir -p out
          for dir in dist/*; do
            target=$(basename "$dir")
            name="kevin-$TAG-$target"
            stage="stage/$name"
            mkdir -p "$stage"
            cp "$dir"/bin/kevin* "$stage"/
            cp LICENSE README.md "$stage"/
            case "$target" in
              *windows*) (cd stage && zip -qr "../out/$name.zip" "$name") ;;
              *) tar -C stage -czf "out/$name.tar.gz" "$name" ;;
            esac
            rm -rf "$stage"
          done
          (cd out && sha256sum * > SHA256SUMS)

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
