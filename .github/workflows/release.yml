name: Release

# Publishes binaries for every supported target when a version tag is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: zig build

      - name: Tag must match the version in build.zig.zon
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(./zig-out/bin/kevin --version | cut -d' ' -f2)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match kevin $version" >&2; exit 1; }

      - name: Full check before publishing
        run: ./zig-out/bin/kevin check

      - name: Cross-compile
        run: ./zig-out/bin/kevin release

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p out
          for dir in dist/*; do
            target=$(basename "$dir")
            name="kevin-$TAG-$target"
            stage="stage/$name"
            mkdir -p "$stage"
            cp "$dir"/bin/kevin* "$stage"/
            cp LICENSE README.md "$stage"/
            case "$target" in
              *windows*) (cd stage && zip -qr "../out/$name.zip" "$name") ;;
              *) tar -C stage -czf "out/$name.tar.gz" "$name" ;;
            esac
            rm -rf "$stage"
          done
          (cd out && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kevin-${{ github.ref_name }}
          path: out/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/* --title "kevin $TAG" --generate-notes
